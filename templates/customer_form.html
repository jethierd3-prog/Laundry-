{% extends "base.html" %}{% block content %}
<div class="card"><h1>{{ 'Edit' if customer else 'New' }} Customer</h1>
<form method="post">
<label>Name</label><input name="name" value="{{ customer.name if customer else '' }}" required>
<label>Phone</label><input name="phone" value="{{ customer.phone if customer else '' }}" required>
<label>Address</label><textarea name="address">{{ customer.address if customer else '' }}</textarea>
<button>Save Customer</button></form></div>{% endblock %}
