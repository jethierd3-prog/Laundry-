{% extends "base.html" %}{% block content %}
<h1>Services</h1><div class="card"><a href="{{ url_for('edit_service',service_id=services[0].id) if services else '#' }}">Edit a service</a></div>
<table><tr><th>Name</th><th>Price/kg</th><th>Description</th><th>Active</th><th>Edit</th></tr>
{% for s in services %}<tr><td>{{s.name}}</td><td>{{s.price_per_kg|money}}</td><td>{{s.description}}</td><td>{{'Yes' if s.active else 'No'}}</td><td><a href="{{url_for('edit_service',service_id=s.id)}}">Edit</a></td></tr>{% endfor %}</table>{% endblock %}
