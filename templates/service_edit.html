{% extends "base.html" %}{% block content %}
<div class="card"><h1>Edit Service</h1><form method="post" action="{{url_for('save_service')}}">
<input type="hidden" name="service_id" value="{{service.id}}">
<label>Name</label><input name="name" value="{{service.name}}" required>
<label>Price per kg</label><input name="price_per_kg" type="number" step="0.01" value="{{service.price_per_kg}}" required>
<label>Description</label><textarea name="description">{{service.description}}</textarea>
<button>Save Service</button></form>
<form method="post" action="{{url_for('delete_service',service_id=service.id)}}"><button>Delete/Archive Service</button></form></div>{% endblock %}
