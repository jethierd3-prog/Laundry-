{% extends "base.html" %}{% block content %}
<h1>Customers</h1>
<div class="card"><form method="get"><input name="q" value="{{ query }}" placeholder="Search name or phone"><button>Search</button></form>
<a href="{{ url_for('new_customer') }}">+ New Customer</a></div>
<table><tr><th>Name</th><th>Phone</th><th>Address</th><th>Orders</th><th></th></tr>
{% for c in customers %}<tr><td><a href="{{ url_for('customer_detail',customer_id=c.id) }}">{{ c.name }}</a></td><td>{{ c.phone }}</td><td>{{ c.address }}</td><td>{{ c.order_count }}</td><td><a href="{{ url_for('edit_customer',customer_id=c.id) }}">Edit</a></td></tr>{% else %}<tr><td colspan="5">No customers found.</td></tr>{% endfor %}
</table>{% endblock %}
